    <style type="text/css" media="screen">

      body {
        padding: 1em;
        text-align: left;
      }

      nav {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      article.editor, article.sans-serif, article.serif, article.monospace {
	margin-top: 10px;
        margin-right: 0;
        margin-bottom: 7px;
        padding: 1em;

	/* to raise the priority of this control */
	background-color: #f5f5f5;
      }

      article.editor {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      #preview-controls {
        display: none;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 5px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      #preview-controls.active {
        display: flex;
      }

      /* Output area: flat, minimal styling, but still plainly editable (I-beam + caret) */
      article.editor {
        border: none;
        border-left: 3px solid #ddd;
        box-shadow: none;
        outline: none;
        background-color: #fafafa;
        cursor: text;
      }

      /* Initial state: the box shows the how-it-works table, so no caret or I-beam until text arrives */
      article.editor:empty {
        caret-color: transparent;
        cursor: default;
      }

      [data-placeholder]:empty:before{
        content: attr(data-placeholder);
        font-style: italic;
      }

      *.sans-serif { font-family: sans-serif; }
      *.serif { font-family: serif; }
      *.monospace { font-family: monospace; }

      /* Buttons aligned to right edge of editor */
      #buttons {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
        padding: 0;
      }

      /* Ensure container doesn't interfere with button visibility */
      .container {
        max-width: none;
        padding: 0;
      }

      /* Counter container match editor width */
      .editor-wrap + div {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      /* Tagline fade */
      #tagline {
        transition: opacity 30s ease-out;
      }

      #tagline.fade-out {
        opacity: 0;
      }

      /* Footer */
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        text-align: center;
        padding: 10px;
        background-color: rgba(255, 255, 255, 0.9);
        font-size: 0.85em;
        color: #999;
        border-top: 1px solid #eee;
      }

      footer a {
        color: #999;
        text-decoration: none;
      }

      footer a:hover {
        color: #666;
        text-decoration: underline;
      }

      /* Formatting removed message */
      /* Wraps editor + toast so the toast can anchor to the editor's top-left */
      .editor-wrap {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        padding-top: 1.6em; /* reserved band so the toast never overlaps the tagline */
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      #formatting-message {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        color: #999;
        font-size: 0.9em;
        opacity: 0;
        transition: opacity 10s ease-out;
      }

      #formatting-message.show {
        opacity: 1;
        transition: none;
      }

      #formatting-message.fade {
        opacity: 0;
      }

      /* Markdown mode active button */
      .btn-markdown-active {
        font-weight: bold;
        background-color: #f0f0f0 !important;
        border-color: #999 !important;
      }

      /* Active font button */
      .font-active {
        font-weight: bold;
        background-color: #f0f0f0 !important;
        border-color: #999 !important;
      }

      /* Markdown preview label (now inside preview-controls) */
      #markdown-preview-label {
        /* No additional styling needed - handled by parent flexbox */
      }

      /* Markdown preview */
      #markdown-preview {
        margin-top: 0;
        padding: 1em;
        background-color: white;
        min-height: 100px;
        display: none;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      #markdown-preview.active {
        display: block;
      }

      /* Markdown preview styling */
      #markdown-preview h1 { font-size: 2em; margin: 0.5em 0; }
      #markdown-preview h2 { font-size: 1.5em; margin: 0.5em 0; }
      #markdown-preview h3 { font-size: 1.25em; margin: 0.5em 0; }
      #markdown-preview h4 { font-size: 1.1em; margin: 0.5em 0; }
      #markdown-preview h5 { font-size: 1em; margin: 0.5em 0; font-weight: bold; }
      #markdown-preview h6 { font-size: 0.9em; margin: 0.5em 0; font-weight: bold; }
      #markdown-preview code { background-color: #f5f5f5; padding: 2px 4px; border-radius: 3px; }
      #markdown-preview pre { background-color: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
      #markdown-preview blockquote { border-left: 4px solid #ddd; padding-left: 1em; margin: 1em 0; color: #666; }
      #markdown-preview table { border-collapse: collapse; margin: 1em 0; }
      #markdown-preview th, #markdown-preview td { border: 1px solid #ddd; padding: 8px; }
      #markdown-preview th { background-color: #f5f5f5; }
      #markdown-preview ul, #markdown-preview ol { margin: 0.5em 0; padding-left: 2em; }
      #markdown-preview hr { border: none; border-top: 2px solid #ddd; margin: 1em 0; }

      /* === FORMAT CLEANER MODE === */
      /* Hide markdown and font UI elements for cleaner mode */
      #convert-to-markdown,
      .btn-group[role="group"],
      #markdown-preview,
      #preview-controls {
        display: none !important;
      }

      /* "How it works" table, shown over the output area while it is empty */
      .howto {
        display: none;
        grid-area: 1 / 1;          /* same cell as the editor, so the box grows to fit */
        align-self: start;
        z-index: 1;
        margin: calc(10px + 1em) 1em calc(7px + 1em);
        border-collapse: collapse;
        color: #888;
        pointer-events: none;   /* clicks fall through to the editor */
      }

      /* ...except the step text, which can be selected and copied */
      .howto td:last-child {
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }

      .editor-wrap:has(#mcguffin:empty) .howto {
        display: table;
      }

      .editor-wrap > article {
        grid-area: 1 / 1;
        margin-left: 0;     /* the wrapper already centers and caps the width */
        margin-right: 0;
      }

      .howto td {
        padding: 0.45em 0.6em;
        vertical-align: middle;
        border-top: 1px solid #e6e6e6;
      }

      .howto tr:first-child td {
        border-top: none;
      }

      .howto td:first-child {
        user-select: none;      /* examples stay out of selections and copies */
        -webkit-user-select: none;
        width: 1%;              /* shrink to the example's content */
        font-size: 0.9em;
        white-space: nowrap;
      }

      .howto .step-num {
        font-weight: bold;
        margin-right: 0.4em;
      }

      /* The example for step 2: the address when nothing is needed, the paste icon otherwise */
      .howto .paste-key,
      .howto:not([data-mode="auto"]) .url-chip {
        display: none;
      }

      .howto:not([data-mode="auto"]) .paste-key {
        display: inline-block;
        vertical-align: middle;
        color: #666;
      }

      .howto .url-chip {
        display: inline-block;
        padding: 0.1em 0.7em;
        border: 1px solid #ccc;
        border-radius: 1em;
        background: #fff;
        color: #666;
      }

      /* Deliberately busy rich text (no underline or link-blue, so it doesn't invite a click).
         Selectable on purpose: it's the sample to copy and paste back to see it cleaned. */
      .howto .sample-styled {
        white-space: nowrap;
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }

      .howto .s-a {
        font-family: Georgia, serif;
        font-weight: bold;
        font-size: 1.15em;
        color: #c0392b;
      }

      .howto .s-b {
        font-family: "Trebuchet MS", sans-serif;
        font-style: italic;
        color: #1e8449;
      }

      .howto .s-c {
        color: #5b2c83;
        background: #fff1a8;
        padding: 0 0.25em;
        font-size: 0.8em;       /* the superscript (<sup>) word */
        font-weight: bold;
      }

      @media (max-width: 480px) {
        .howto td:first-child {
          font-size: 0.72em;
        }

        .howto .s-c {
          padding: 0 0.1em;
        }
      }

          aria_paste: "ഒട്ടിക്കുക",
          footer_open_source: "ഓപ്പൺ സോഴ്‌സ്"
        }
      };

      // ===== DOM ELEMENT CACHE =====
      const DOM = {};

      // ===== UTILITY FUNCTIONS =====

      /**
       * Cache DOM element references for better performance
       */
      function cacheDOMElements() {
        DOM.editor = document.querySelector('#mcguffin');
        DOM.tagline = document.getElementById('tagline');
        DOM.formattingMessage = document.getElementById('formatting-message');
        DOM.markdownBtn = document.getElementById('convert-to-markdown');
        DOM.markdownPreview = document.getElementById('markdown-preview');
        DOM.previewControls = document.getElementById('preview-controls');
        DOM.removeFormattingBtn = document.getElementById('remove-formatting');
        DOM.buttons = document.querySelector('#buttons');
        DOM.fontButtons = document.querySelectorAll('[data-font]');
      }

      /**
       * Show a temporary prompt message that fades out
       * @param {string} text - Message to display
       */
      function showPrompt(text) {
        debugLog('toast:', JSON.stringify(text));
        const message = DOM.formattingMessage;
        message.textContent = text;
        message.classList.remove('fade');
        message.classList.add('show');
        // Force reflow to restart animation
        void message.offsetWidth;
        message.classList.remove('show');
        message.classList.add('fade');
      }

      /**
       * Restore cursor position to end of content
       * @param {HTMLElement} element - Element to focus
       */
      function restoreCursorToEnd(element) {
        element.focus();
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(element);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      /**
       * Save cursor position as character offset from start
       * @param {HTMLElement} element - Element to get cursor position from
       * @returns {number} Character offset from start of element
       */
      function saveCursorPosition(element) {
        const selection = window.getSelection();
        if (selection.rangeCount === 0) return 0;

        const range = selection.getRangeAt(0);
        const preCaretRange = range.cloneRange();
        preCaretRange.selectNodeContents(element);
        preCaretRange.setEnd(range.endContainer, range.endOffset);

        return preCaretRange.toString().length;
      }

      /**
       * Restore cursor position from character offset
       * @param {HTMLElement} element - Element to restore cursor position in
       * @param {number} offset - Character offset from start
       */
      function restoreCursorPosition(element, offset) {
        const selection = window.getSelection();
        const range = document.createRange();

        let charCount = 0;
        let nodeStack = [element];
        let node, foundNode, foundOffset;

        while (node = nodeStack.pop()) {
          if (node.nodeType === Node.TEXT_NODE) {
            const nextCharCount = charCount + node.length;
            if (!foundNode && offset >= charCount && offset <= nextCharCount) {
              foundNode = node;
              foundOffset = offset - charCount;
              break;
            }
            charCount = nextCharCount;
          } else {
            // Add child nodes to stack in reverse order to process in correct order
            for (let i = node.childNodes.length - 1; i >= 0; i--) {
              nodeStack.push(node.childNodes[i]);
            }
          }
        }

        if (foundNode) {
          range.setStart(foundNode, foundOffset);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
        } else {
          // If we can't find the exact position, put cursor at end
          range.selectNodeContents(element);
          range.collapse(false);
          selection.removeAllRanges();
          selection.addRange(range);
        }

        element.focus();
      }

      // ===== INTERNATIONALIZATION =====

      /**
       * Get translation for a key in current language
       * @param {string} key - Translation key
       * @returns {string} Translated string or key if not found
       */
      function t(key) {
        const lang = TRANSLATIONS[currentLang] || TRANSLATIONS['en'];
        return lang[key] || TRANSLATIONS['en'][key] || key;
      }

      /**
       * Apply translations to all elements with data-i18n attributes
       */
      function applyTranslations() {
        const lang = currentLang;
        const htmlEl = document.documentElement;

        // Update html lang attribute
        htmlEl.setAttribute('lang', lang);

        // The window title, in the selected language
        document.title = t('page_title');

        // Update meta description
        const metaDesc = document.querySelector('meta[data-i18n-content]');
        if (metaDesc) {
          metaDesc.setAttribute('content', t(metaDesc.getAttribute('data-i18n-content')));
        }

        // Update text content
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (key) el.textContent = t(key);
        });

        // Update title attributes (tooltips)
        document.querySelectorAll('[data-i18n-title]:not(title)').forEach(el => {
          const key = el.getAttribute('data-i18n-title');
          if (key) el.setAttribute('title', t(key));
        });

        // Update accessible labels
        document.querySelectorAll('[data-i18n-aria-label]').forEach(el => {
          const key = el.getAttribute('data-i18n-aria-label');
          if (key) el.setAttribute('aria-label', t(key));
        });

        // Update placeholder attributes
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (key) el.setAttribute('data-placeholder', t(key));
        });
      }

      /**
       * Detect and set user's browser language
       */
      function detectLanguage() {
        const browserLang = navigator.language || navigator.userLanguage;
        const langCode = browserLang.split('-')[0]; // Get just the language code (e.g., 'en' from 'en-US')

        // Check if we support this language
        if (TRANSLATIONS[langCode]) {
          currentLang = langCode;
        } else {
          currentLang = 'en'; // Fallback to English
        }

        // Update selector
        const selector = document.getElementById('language-selector');
        if (selector) {
          selector.value = currentLang;
        }
      }

      /**
       * Change language and apply translations
       * @param {string} lang - Language code
       */
      function changeLanguage(lang) {
        currentLang = lang;
        applyTranslations();

        // Update URL hash
        window.location.hash = lang;
      }

      // ===== MARKDOWN CONVERSION =====

      /**
       * Convert HTML content to Markdown format
       * @param {string} html - HTML string to convert
       * @returns {string} Markdown formatted string
       */
      function htmlToMarkdown(html) {
        // Create a temporary div to parse HTML
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;

        let markdown = convertNodeToMarkdown(tempDiv);

        // Limit consecutive line breaks
        const maxBreaks = MAX_CONSECUTIVE_BREAKS + 1;
        const regex = new RegExp(`\\n{${maxBreaks},}`, 'g');
        markdown = markdown.replace(regex, '\n'.repeat(MAX_CONSECUTIVE_BREAKS));

        return markdown;
      }

      /**
       * Recursively convert DOM node to Markdown
       * @param {Node} node - DOM node to convert
       * @param {number} listDepth - Current nesting level for lists
       * @returns {string} Markdown string
       */
      function convertNodeToMarkdown(node, listDepth = 0) {
        let markdown = '';

        // Handle text nodes
        if (node.nodeType === Node.TEXT_NODE) {
          return node.textContent;
        }

        // Handle element nodes
        if (node.nodeType === Node.ELEMENT_NODE) {
          const tagName = node.tagName.toLowerCase();
          const children = Array.from(node.childNodes);
          let childContent = children.map(child => convertNodeToMarkdown(child, listDepth)).join('');

          switch (tagName) {
            // Headings
            case 'h1':
              return '# ' + childContent + '\n\n';
            case 'h2':
              return '## ' + childContent + '\n\n';
            case 'h3':
              return '### ' + childContent + '\n\n';
            case 'h4':
              return '#### ' + childContent + '\n\n';
            case 'h5':
              return '##### ' + childContent + '\n\n';
            case 'h6':
              return '###### ' + childContent + '\n\n';

            // Bold
            case 'b':
            case 'strong':
              return '**' + childContent + '**';

            // Italic
            case 'i':
            case 'em':
              return '*' + childContent + '*';

            // Strikethrough
            case 's':
            case 'strike':
            case 'del':
              return '~~' + childContent + '~~';

            // Inline code
            case 'code':
              if (node.parentElement && node.parentElement.tagName.toLowerCase() === 'pre') {
                return childContent;
              }
              return '`' + childContent + '`';

            // Code block
            case 'pre':
              const codeChild = node.querySelector('code');
              const codeContent = codeChild ? codeChild.textContent : childContent;
              return '```\n' + codeContent + '\n```\n\n';

            // Links
            case 'a':
              const href = node.getAttribute('href') || '';
              return '[' + childContent + '](' + href + ')';

            // Images
            case 'img':
              const src = node.getAttribute('src') || '';
              const alt = node.getAttribute('alt') || '';
              return '![' + alt + '](' + src + ')';

            // Blockquote
            case 'blockquote':
              return childContent.split('\n').map(line => '> ' + line).join('\n') + '\n\n';

            // Horizontal rule
            case 'hr':
              return '\n---\n\n';

            // Line break
            case 'br':
              return '\n';

            // Paragraph
            case 'p':
              return childContent + '\n\n';

            // Div (treat as block)
            case 'div':
              return childContent + '\n';

            // Lists
            case 'ul':
            case 'ol':
              const isOrdered = tagName === 'ol';
              const listItems = Array.from(node.children).filter(child =>
                child.tagName.toLowerCase() === 'li'
              );
              return listItems.map((li, index) => {
                const indent = '  '.repeat(listDepth);
                const bullet = isOrdered ? `${index + 1}. ` : '- ';
                const content = convertNodeToMarkdown(li, listDepth + 1);
                return indent + bullet + content.trim();
              }).join('\n') + '\n\n';

            case 'li':
              // Content is handled by parent ul/ol
              return childContent;

            // Tables
            case 'table':
              return convertTableToMarkdown(node) + '\n\n';

            // Underline (no markdown equivalent, just return text)
            case 'u':
              return childContent;

            // Span and other inline elements (strip tags)
            case 'span':
            case 'font':
            case 'mark':
              return childContent;

            // Default: just return child content
            default:
              return childContent;
          }
        }

        // Handle other node types
        return markdown;
      }

      /**
       * Convert HTML table to Markdown table format
       * @param {HTMLTableElement} table - Table element to convert
       * @returns {string} Markdown table string
       */
      function convertTableToMarkdown(table) {
        const rows = Array.from(table.querySelectorAll('tr'));
        if (rows.length === 0) return '';

        let markdown = '';
        let isFirstRow = true;

        rows.forEach(row => {
          const cells = Array.from(row.querySelectorAll('th, td'));
          const cellContents = cells.map(cell => {
            return convertNodeToMarkdown(cell).trim().replace(/\n/g, ' ');
          });

          markdown += '| ' + cellContents.join(' | ') + ' |\n';

          // Add separator after first row (header)
          if (isFirstRow) {
            markdown += '| ' + cells.map(() => '---').join(' | ') + ' |\n';
            isFirstRow = false;
          }
        });

        return markdown;
      }

      // Simple markdown to HTML renderer
      // ===== MARKDOWN RENDERING =====

      /**
       * Render Markdown text to HTML
       * @param {string} text - Markdown formatted text
       * @returns {string} HTML string
       */
      function renderMarkdown(text) {
        let html = text;

        // Escape HTML
        html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        // Headers
        html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
        html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
        html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

        // Bold
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

        // Italic
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.+?)_/g, '<em>$1</em>');

        // Strikethrough
        html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

        // Inline code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Code blocks
        html = html.replace(/```\n?([\s\S]*?)\n?```/g, '<pre><code>$1</code></pre>');

        // Links
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

        // Images
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

        // Horizontal rules
        html = html.replace(/^---$/gm, '<hr>');
        html = html.replace(/^\*\*\*$/gm, '<hr>');

        // Blockquotes
        html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');

        // Unordered lists
        html = html.replace(/^\*\s+(.+)$/gm, '<li>$1</li>');
        html = html.replace(/^-\s+(.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

        // Ordered lists
        html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

        // Checkbox lists
        html = html.replace(/<li>\[ \]\s+(.+)<\/li>/g, '<li><input type="checkbox" disabled> $1</li>');
        html = html.replace(/<li>\[x\]\s+(.+)<\/li>/g, '<li><input type="checkbox" checked disabled> $1</li>');

        // Line breaks
        html = html.replace(/\n/g, '<br>');

        return html;
      }

      // ===== UI EVENT HANDLERS =====

      /**
       * Initialize tagline fade-out
       */
      function initializeTaglineFade() {
        setTimeout(() => {
          DOM.tagline.classList.add('fade-out');
        }, TIMING.TAGLINE_FADE_DELAY);
      }

      const BLOCK_ELEMENTS = new Set([
        'ADDRESS','ARTICLE','ASIDE','BLOCKQUOTE','DD','DIV','DL','DT',
        'FIGCAPTION','FIGURE','FOOTER','H1','H2','H3','H4','H5','H6',
        'HEADER','HR','LI','MAIN','NAV','OL','P','PRE','SECTION',
        'SUMMARY','TABLE','TD','TH','TR','UL',
      ]);

      function extractPlainText(node) {
        if (node.nodeType === 3) return node.textContent; // TEXT_NODE
        if (node.nodeName === 'BR') return '\n';
        let text = '';
        for (const child of node.childNodes) {
          if (BLOCK_ELEMENTS.has(child.nodeName) && text.length > 0 && !text.endsWith('\n')) {
            text += '\n';
          }
          text += extractPlainText(child);
        }
        if (BLOCK_ELEMENTS.has(node.nodeName)) text += '\n';
        return text;
      }

      /**
       * Write text to the clipboard. Resolves true on success, false on failure.
       * @param {string} text
       * @returns {Promise<boolean>}
       */
      function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).then(
            () => { debugLog('writeText ok,', text.length, 'chars'); return true; },
            (err) => { debugLog('writeText FAILED:', describeError(err)); return false; }
          );
        }
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (_) {}
        document.body.removeChild(textarea);
        debugLog('execCommand copy fallback ->', ok);
        return Promise.resolve(ok);
      }

      /** Select everything in the editor so the user can copy it manually. */
      function selectEditorContents() {
        DOM.editor.focus();
        const range = document.createRange();
        range.selectNodeContents(DOM.editor);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      /** Strip formatting from a raw string (HTML or plain text); returns plain text. */
      function cleanRaw(rawContent) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawContent, 'text/html');
        return extractPlainText(doc.body).replace(/\n{3,}/g, '\n\n').trim();
      }

      /**
       * Clean a raw string (HTML or plain text) and put the result on the clipboard.
       * Unless `silent`, also show it in the editor and report the real outcome
       * with a toast. Silent runs (automatic, no user action) touch nothing but the
       * clipboard.
       * Resolves to the cleaned text.
       */
      function cleanAndCopyText(rawContent, { silent = false } = {}) {
        const cleanedText = cleanRaw(rawContent);

        if (!silent) {
          DOM.editor.innerHTML = '';
          cleanedText.split('\n').forEach((line, i) => {
            if (i > 0) DOM.editor.appendChild(document.createElement('br'));
            if (line) DOM.editor.appendChild(document.createTextNode(line));
          });

        }

        // Report the real outcome: the clipboard write can be denied (no user
        // gesture, permissions policy), so only claim "copied" once it succeeds.
        return copyToClipboard(cleanedText).then((ok) => {
          if (!silent) {
            if (ok) {
              showPrompt(t('msg_cleaned_and_copied'));
            } else {
              // Copy failed: select the text so Ctrl/Cmd+C finishes the job.
              selectEditorContents();
              showPrompt(t('msg_cleaned_copy_failed'));
            }
          }
          return cleanedText;
        });
      }

      /**
       * Initialize auto-clean-paste functionality
       * Automatically removes formatting from pasted content and copies to clipboard.
       * Listens on the document, not the editor: after Select All or a click on the
       * help text the selection is outside the editor, and the paste would otherwise
       * go nowhere.
       */
      function initializeAutoCleanPaste() {
        // Use capture phase to run before any other paste handler
        document.addEventListener("paste", (event) => {
          // Leave real form controls (e.g. the language selector) alone
          if (event.target.closest && event.target.closest('select, input, textarea')) return;

          event.preventDefault();
          event.stopImmediatePropagation(); // Prevent other paste handlers

          const clipboardData = event.clipboardData || window.clipboardData;

          if (!clipboardData) { debugLog('paste event: no clipboardData'); return; }
          debugLog('paste event', {
            target: event.target.nodeName + (event.target.id ? '#' + event.target.id : ''),
            types: Array.from(clipboardData.types || []),
          });

          // Check for images (reject them)
          const items = clipboardData.items;
          if (items) {
            for (let i = 0; i < items.length; i++) {
              if (items[i].type.indexOf('image') !== -1) {
                showPrompt(t('msg_images_not_supported'));
                return;
              }
            }
          }

          const rawContent = clipboardData.getData('text/html') ||
                             clipboardData.getData('text/plain');

          if (!rawContent || rawContent.trim() === '') { debugLog('paste event: empty content, ignored'); return; }

          debugLog('paste event: cleaning', rawContent.length, 'chars');
          cleanAndCopyText(rawContent);
          DOM.editor.focus();
        }, { capture: true }); // Run in capture phase!
      }

      /**
       * Clean the clipboard silently, with no user action, once the browser has
       * already granted clipboard-read (Chrome/Edge after the first grant): on page
       * load and whenever the tab regains focus. Rewrites the clipboard as plain text
       * and shows nothing.
       *
       * Deliberately NOT triggered by clicks or keypresses: a read fired by an
       * arbitrary click raises a permission prompt (Chrome) or the "Paste" bubble
       * (Safari/Firefox) at a surprising moment. Pasting into the page is the one
       * visible action, and it goes through the paste event instead.
       */
      function initializeAutoClipboardRead() {
        debugLog('init', debugEnv(), navigator.userAgent);
        if (!navigator.clipboard || !navigator.clipboard.read) {
          debugLog('init: navigator.clipboard.read unavailable, auto-clean disabled');
          return;
        }

        const silentDone = new Set();   // clipboard contents already cleaned
        let granted = false;
        let busy = false;

        async function run() {
          if (busy || !document.hasFocus()) {
            debugLog('silent clean skipped:', busy ? 'already busy' : 'document not focused', debugEnv());
            return;
          }
          busy = true;
          let phase = 'read';
          debugLog('silent clean start', debugEnv());
          try {
            let raw = '';
            let hasHtml = false;
            const clipItems = await navigator.clipboard.read();
            phase = 'getType';
            debugLog('silent clean clipboard.read ok:', clipItems.map((i) => i.types));
            for (const item of clipItems) {
              if (item.types.includes('text/html')) {
                raw = await (await item.getType('text/html')).text();
                hasHtml = true;
              } else if (item.types.includes('text/plain')) {
                raw = await (await item.getType('text/plain')).text();
              } else if (item.types.some((type) => type.startsWith('image/'))) {
                debugLog('silent clean: clipboard holds an image, ignored');
                return;
              }
              if (raw) break;
            }
            phase = 'clean/copy';
            debugLog('silent clean raw:', { length: raw.length, hasHtml });
            // Only rewrite when there is formatting to strip, and once per content
            if (!raw.trim() || !hasHtml || silentDone.has(raw)) {
              debugLog('silent clean skipped:', !raw.trim() ? 'clipboard text is empty' : !hasHtml ? 'no HTML flavor to strip' : 'already cleaned this content');
              return;
            }
            silentDone.add(raw);
            await cleanAndCopyText(raw, { silent: true });
            debugLog('silent clean rewrote the clipboard');
          } catch (err) {
            // Stay quiet: this was automatic, and manual paste still works
            debugLog(`silent clean FAILED at phase "${phase}":`, describeError(err), debugEnv());
          } finally {
            busy = false;
          }
        }

        function onReturn() {
          debugLog('tab regained focus/visibility. granted =', granted);
          if (granted) run();
        }

        window.addEventListener('focus', onReturn);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') onReturn();
        });

        if (!navigator.permissions) debugLog('permissions API unavailable');
        navigator.permissions?.query({ name: 'clipboard-read' }).then((status) => {
          granted = status.state === 'granted';
          debugLog('permission clipboard-read:', status.state);
          status.addEventListener('change', () => {
            granted = status.state === 'granted';
            debugLog('permission clipboard-read changed to:', status.state);
          });
          if (granted) run();
        }).catch((err) => { debugLog('permissions.query(clipboard-read) rejected:', describeError(err)); });
      }

      /**
       * Tailor step 2 of the how-it-works table to what this browser allows:
       *   auto  - clipboard-read already granted, nothing to do
       *   click - permission still to be prompted, or can't be queried (Safari/Firefox):
       *           the user pastes (the text says so)
       *   paste - clipboard API unavailable or denied, paste into the box
       */
      function initializeHowToMode() {
        const table = document.querySelector('.howto');
        const step = document.getElementById('howto-step2');
        if (!table || !step) return;

        function setMode(mode, why) {
          debugLog('how-to step 2 mode ->', mode, '(' + why + ')');
          table.setAttribute('data-mode', mode);
          step.setAttribute('data-i18n', `howto_step2_${mode}`);
          step.textContent = t(`howto_step2_${mode}`);
        }

        if (!window.isSecureContext || !navigator.clipboard || !navigator.clipboard.read) {
          setMode('paste', 'insecure context or navigator.clipboard.read missing');
          return;
        }

        const fromState = (state) =>
          state === 'granted' ? 'auto' : state === 'denied' ? 'paste' : 'click';

        navigator.permissions.query({ name: 'clipboard-read' }).then((status) => {
          setMode(fromState(status.state), 'permission state "' + status.state + '"');
          status.addEventListener('change', () => setMode(fromState(status.state), 'permission changed to "' + status.state + '"'));
        }).catch((err) => setMode('click', 'permissions.query rejected: ' + describeError(err)));
      }

      /**
       * While the output is empty the focused editor has nothing to select, so
       * Select All (Ctrl/Cmd+A) selects the styled sample text instead of nothing:
       * copy it, paste it back, and watch the formatting go.
       * Once there is cleaned text, Select All keeps its normal meaning.
       */
      function initializeSelectAllHelp() {
        document.addEventListener('keydown', (event) => {
          if (!(event.ctrlKey || event.metaKey) || event.altKey || event.shiftKey) return;
          if (event.key.toLowerCase() !== 'a') return;
          const table = document.querySelector('.howto');
          const sample = table && table.querySelector('.sample-styled');
          if (!sample || getComputedStyle(table).display === 'none') return;
          if (event.target !== DOM.editor) return;
          event.preventDefault();
          const range = document.createRange();
          range.selectNodeContents(sample);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        });
      }

      /**
       * Initialize markdown preview updates
       */
      function initializeEditorInput() {
        DOM.editor.addEventListener("input", () => {
          const characterCount = DOM.editor.innerText.trim().length;

          // Update markdown preview if in markdown mode
          if (markdownMode) {
            const text = DOM.editor.innerText;
            DOM.markdownPreview.innerHTML = renderMarkdown(text);

            // Show/hide preview area based on content
            if (characterCount > 0) {
              DOM.markdownPreview.classList.add('active');
              DOM.previewControls.classList.add('active');
            } else {
              DOM.markdownPreview.classList.remove('active');
              DOM.previewControls.classList.remove('active');
            }
          }
        });
      }

      /**
       * Initialize font switching buttons
       */
      function initializeFontButtons() {
        DOM.buttons.addEventListener("click", (event) => {
          const font = event.target.dataset.font;
          if (font === "sans-serif" || font === "monospace") {
            DOM.editor.classList.remove("sans-serif", "monospace");
            DOM.editor.classList.add(font);

            // Update active button styling
            DOM.fontButtons.forEach(btn => btn.classList.remove('font-active'));
            event.target.classList.add('font-active');
          }
        });
      }

      /**
       * Initialize markdown mode toggle
       */
      function initializeMarkdownToggle() {
        DOM.markdownBtn.addEventListener("click", () => {
          markdownMode = !markdownMode;

          if (markdownMode) {
            // Activate markdown mode
            DOM.markdownBtn.classList.add('btn-markdown-active');

            // Save cursor position before modifying content
            const cursorPosition = saveCursorPosition(DOM.editor);

            // Convert current HTML to markdown
            const html = DOM.editor.innerHTML;
            const markdown = htmlToMarkdown(html).trim();
            DOM.editor.innerHTML = markdown.replace(/\n/g, '<br>');

            // Show preview and controls only if there's content
            const text = DOM.editor.innerText;
            DOM.markdownPreview.innerHTML = renderMarkdown(text);

            if (text.trim().length > 0) {
              DOM.markdownPreview.classList.add('active');
              DOM.previewControls.classList.add('active');
            }

            // Restore cursor position to where it was
            restoreCursorPosition(DOM.editor, cursorPosition);
          } else {
            // Deactivate markdown mode
            DOM.markdownBtn.classList.remove('btn-markdown-active');
            DOM.markdownPreview.classList.remove('active');
            DOM.previewControls.classList.remove('active');
          }
        });
      }

      /**
       * Initialize remove formatting button
       */
      function initializeRemoveFormatting() {
        DOM.removeFormattingBtn.addEventListener("click", () => {
          // Save cursor position before modifying content
          const cursorPosition = saveCursorPosition(DOM.editor);

          // Get plain text with line breaks preserved
          const text = DOM.editor.innerText;
          // Replace line breaks with <br> tags and set as HTML
          DOM.editor.innerHTML = text.replace(/\n/g, '<br>');

          // Restore cursor position to where it was
          restoreCursorPosition(DOM.editor, cursorPosition);

          showPrompt(t('msg_formatting_removed'));
        });
      }

      /**
       * Initialize markdown editor keyboard handlers
       */
      function initializeMarkdownKeyboard() {
        // Handle paste events to convert HTML to markdown
        DOM.editor.addEventListener("paste", (event) => {
          if (!markdownMode) return;

          // Get clipboard data
          const clipboardData = event.clipboardData || window.clipboardData;
          const htmlData = clipboardData.getData('text/html');

          // If there's HTML data, convert it to markdown
          if (htmlData && htmlData.trim()) {
            event.preventDefault();

            // Convert HTML to markdown
            const markdown = htmlToMarkdown(htmlData);

            // Insert the markdown text
            document.execCommand('insertText', false, markdown);

            // Update preview
            const text = DOM.editor.innerText;
            DOM.markdownPreview.innerHTML = renderMarkdown(text);

            // Show preview if there's content
            if (text.trim().length > 0) {
              DOM.markdownPreview.classList.add('active');
              DOM.previewControls.classList.add('active');
            }
          }
        });

        DOM.editor.addEventListener("keydown", (event) => {
          if (!markdownMode) return;

          // Tab: indent
          if (event.key === 'Tab' && !event.shiftKey) {
            event.preventDefault();
            document.execCommand('insertText', false, '  ');
            return;
          }

          // Shift+Tab: unindent
          if (event.key === 'Tab' && event.shiftKey) {
            event.preventDefault();
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
              const range = sel.getRangeAt(0);
              const textNode = range.startContainer;
              if (textNode.nodeType === Node.TEXT_NODE) {
                const text = textNode.textContent;
                const offset = range.startOffset;
                // Remove up to 2 spaces before cursor
                let removed = 0;
                if (offset > 0 && text[offset - 1] === ' ') {
                  removed = 1;
                  if (offset > 1 && text[offset - 2] === ' ') {
                    removed = 2;
                  }
                }
                if (removed > 0) {
                  const newText = text.slice(0, offset - removed) + text.slice(offset);
                  textNode.textContent = newText;
                  range.setStart(textNode, offset - removed);
                  range.collapse(true);
                  sel.removeAllRanges();
                  sel.addRange(range);
                }
              }
            }
            return;
          }

          // Enter: handle list continuation
          if (event.key === 'Enter') {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
              const range = sel.getRangeAt(0);
              const textNode = range.startContainer;
              if (textNode.nodeType === Node.TEXT_NODE) {
                const text = textNode.textContent;
                const offset = range.startOffset;

                // Find the start of the current line
                let lineStart = text.lastIndexOf('\n', offset - 1) + 1;
                const currentLine = text.substring(lineStart, offset);

                // Check for unordered list (*, -, +)
                const unorderedMatch = currentLine.match(/^(\s*)([-*+])\s+(.*)$/);
                if (unorderedMatch) {
                  event.preventDefault();
                  const indent = unorderedMatch[1];
                  const marker = unorderedMatch[2];
                  const content = unorderedMatch[3];

                  // If line is empty list item, exit list mode
                  if (!content.trim()) {
                    document.execCommand('insertText', false, '\n');
                  } else {
                    // Continue list
                    document.execCommand('insertText', false, '\n' + indent + marker + ' ');
                  }
                  return;
                }

                // Check for ordered list (1., 2., etc.)
                const orderedMatch = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
                if (orderedMatch) {
                  event.preventDefault();
                  const indent = orderedMatch[1];
                  const num = parseInt(orderedMatch[2]);
                  const content = orderedMatch[3];

                  // If line is empty list item, exit list mode
                  if (!content.trim()) {
                    document.execCommand('insertText', false, '\n');
                  } else {
                    // Continue list with incremented number
                    document.execCommand('insertText', false, '\n' + indent + (num + 1) + '. ');
                  }
                  return;
                }

                // Check for checkbox list (- [ ] or - [x])
                const checkboxMatch = currentLine.match(/^(\s*)-\s+\[([ x])\]\s+(.*)$/);
                if (checkboxMatch) {
                  event.preventDefault();
                  const indent = checkboxMatch[1];
                  const content = checkboxMatch[3];

                  if (!content.trim()) {
                    document.execCommand('insertText', false, '\n');
                  } else {
                    document.execCommand('insertText', false, '\n' + indent + '- [ ] ');
                  }
                  return;
                }

                // Check for blockquote
                const blockquoteMatch = currentLine.match(/^(>\s+)(.*)$/);
                if (blockquoteMatch) {
                  event.preventDefault();
                  const content = blockquoteMatch[2];
                  if (!content.trim()) {
                    document.execCommand('insertText', false, '\n');
                  } else {
                    document.execCommand('insertText', false, '\n> ');
                  }
                  return;
                }
              }
            }
          }

          // Keyboard shortcuts
          if (event.ctrlKey || event.metaKey) {
            let handled = false;

            // Ctrl/Cmd+B: Bold
            if (event.key === 'b' || event.key === 'B') {
              event.preventDefault();
              wrapSelection('**', '**');
              handled = true;
            }

            // Ctrl/Cmd+I: Italic
            if (event.key === 'i' || event.key === 'I') {
              event.preventDefault();
              wrapSelection('*', '*');
              handled = true;
            }

            // Ctrl/Cmd+K: Link
            if (event.key === 'k' || event.key === 'K') {
              event.preventDefault();
              const sel = window.getSelection();
              const selectedText = sel.toString();
              if (selectedText) {
                wrapSelection('[', '](url)');
              } else {
                document.execCommand('insertText', false, '[](url)');
              }
              handled = true;
            }

            // Ctrl/Cmd+`: Inline code
            if (event.key === '`') {
              event.preventDefault();
              wrapSelection('`', '`');
              handled = true;
            }

            // Ctrl/Cmd+1-6: Headings
            if (event.key >= '1' && event.key <= '6') {
              event.preventDefault();
              const level = event.key;
              const hashes = '#'.repeat(level);
              insertAtLineStart(hashes + ' ');
              handled = true;
            }
          }
        });

        // Helper function to wrap selection with prefix and suffix
        function wrapSelection(prefix, suffix) {
          const sel = window.getSelection();
          if (sel.rangeCount > 0) {
            const range = sel.getRangeAt(0);
            const selectedText = sel.toString();
            const newText = prefix + selectedText + suffix;
            document.execCommand('insertText', false, newText);

            // If there was no selection, move cursor between the markers
            if (!selectedText) {
              const newSel = window.getSelection();
              const newRange = newSel.getRangeAt(0);
              newRange.setStart(newRange.startContainer, newRange.startOffset - suffix.length);
              newRange.collapse(true);
              newSel.removeAllRanges();
              newSel.addRange(newRange);
            }
          }
        }

        // Helper function to insert text at start of current line
        function insertAtLineStart(text) {
          const sel = window.getSelection();
          if (sel.rangeCount > 0) {
            const range = sel.getRangeAt(0);
            const textNode = range.startContainer;
            if (textNode.nodeType === Node.TEXT_NODE) {
              const fullText = textNode.textContent;
              const offset = range.startOffset;
              const lineStart = fullText.lastIndexOf('\n', offset - 1) + 1;

              // Insert at line start
              const newText = fullText.slice(0, lineStart) + text + fullText.slice(lineStart);
              textNode.textContent = newText;

              // Move cursor after inserted text
              range.setStart(textNode, lineStart + text.length);
              range.collapse(true);
              sel.removeAllRanges();
              sel.addRange(range);
            }
          }
        }

        // Auto-pairing for markdown syntax
        DOM.editor.addEventListener("beforeinput", function(event) {
          if (!markdownMode) return;

          // Auto-pair * for bold/italic
          if (event.data === '*' && event.inputType === 'insertText') {
            event.preventDefault();
            document.execCommand('insertText', false, '**');
            // Move cursor back 1 position to be in the middle
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
              const range = sel.getRangeAt(0);
              const textNode = range.startContainer;
              if (textNode.nodeType === Node.TEXT_NODE) {
                const offset = range.startOffset;
                range.setStart(textNode, offset - 1);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
              }
            }
            return;
          }

          // Auto-pair ` for code
          if (event.data === '`' && event.inputType === 'insertText') {
            event.preventDefault();
            document.execCommand('insertText', false, '``');
            // Move cursor back 1 position to be in the middle
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
              const range = sel.getRangeAt(0);
              const textNode = range.startContainer;
              if (textNode.nodeType === Node.TEXT_NODE) {
                const offset = range.startOffset;
                range.setStart(textNode, offset - 1);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
              }
            }
            return;
          }

          // Auto-pair [] for links
          if (event.data === '[' && event.inputType === 'insertText') {
            event.preventDefault();
            document.execCommand('insertText', false, '[]');
            // Move cursor back 1 position
            const sel = window.getSelection();
            const range = sel.getRangeAt(0);
            range.setStart(range.startContainer, range.startOffset - 1);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
          }

          // Auto-complete ]( for links
          if (event.data === ']' && event.inputType === 'insertText') {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
              const range = sel.getRangeAt(0);
              const textNode = range.startContainer;
              if (textNode.nodeType === Node.TEXT_NODE) {
                const text = textNode.textContent;
                const offset = range.startOffset;
                // Check if next char is already ]
                if (offset < text.length && text[offset] === ']') {
                  event.preventDefault();
                  // Move cursor forward and add ()
                  range.setStart(textNode, offset + 1);
                  range.collapse(true);
                  sel.removeAllRanges();
                  sel.addRange(range);
                  document.execCommand('insertText', false, '()');
                  // Move cursor back 1
                  const newRange = sel.getRangeAt(0);
                  newRange.setStart(newRange.startContainer, newRange.startOffset - 1);
                  newRange.collapse(true);
                  sel.removeAllRanges();
                  sel.addRange(newRange);
                }
              }
            }
          }
        });
      }

      // ===== MAIN INITIALIZATION =====

      /**
       * Initialize all features when DOM is loaded
       */
      function initialize() {
        // Initialize i18n first
        // Priority: URL hash > browser detection (no hash means use browser preference)
        const hashLang = window.location.hash.substring(1); // Remove the # symbol

        if (hashLang && TRANSLATIONS[hashLang]) {
          // Hash present: use it
          currentLang = hashLang;
        } else {
          // No hash: always respect browser preference
          detectLanguage();
        }
        applyTranslations();

        // Set up language selector
        const languageSelector = document.getElementById('language-selector');
        if (languageSelector) {
          languageSelector.value = currentLang;
          languageSelector.addEventListener('change', (e) => {
            changeLanguage(e.target.value);
          });
        }

        cacheDOMElements();

        // Initialize auto-clean-paste FIRST (before other handlers)
        initializeAutoCleanPaste();
        initializeAutoClipboardRead();
        initializeHowToMode();
        initializeSelectAllHelp();

        initializeTaglineFade();
        initializeEditorInput();
        initializeFontButtons();
        // initializeMarkdownToggle();  // DISABLED: UI hidden for cleaner mode
        // initializeMarkdownKeyboard();  // DISABLED: Conflicts with auto-clean paste

        // Set button state based on markdown mode
        // (Markdown UI is hidden, but keep this for potential future restoration)
        if (markdownMode) {
          DOM.markdownBtn.classList.add('btn-markdown-active');
        }

        // Ensure cursor is visible on page load
        DOM.editor.focus();
      }

      // Initialize when page loads
      window.addEventListener("load", initialize);
    </script>
